<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 猜拳小教室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=20261104b">
</head>
<body>
<header class="topbar">
  <div class="brand">🤖 AI 猜拳小教室</div>
  <nav class="steps">
    <button class="step" data-step="1"><b>1</b>訓練模型</button>
    <span class="step-arrow">›</span>
    <button class="step" data-step="2" disabled><b>2</b>排列積木</button>
    <span class="step-arrow">›</span>
    <button class="step" data-step="3" disabled><b>3</b>看成果</button>
  </nav>
  <div class="top-right">
    <span id="engineState" class="engine">⏳ AI 引擎載入中…</span>
    <button id="hintBtn" class="hint-btn">💡 小提示</button>
  </div>
</header>

<main>
  <!-- ========== STEP 1: TRAIN ========== -->
  <section id="page1" class="page tm">
    <div class="tm-col tm-classes" id="classList"></div>
    <div class="tm-flow">›</div>
    <div class="tm-col tm-train">
      <div class="card">
        <h3>訓練</h3>
        <button id="trainBtn" class="tm-btn">訓練模型</button>
        <div id="trainStatus" class="train-status"></div>
        <div class="progress"><div id="trainBar"></div></div>
        <details class="adv">
          <summary>進階</summary>
          <label>訓練週期 <input id="advEpochs" type="number" value="50" min="5" max="200"></label>
          <label>批次大小 <select id="advBatch"><option>16</option><option>32</option><option>64</option></select></label>
          <label>學習率 <input id="advLr" type="number" value="0.001" step="0.0001" min="0.0001" max="0.1"></label>
        </details>
      </div>
    </div>
    <div class="tm-flow">›</div>
    <div class="tm-col tm-preview">
      <div class="card">
        <div class="card-head"><h3>預覽</h3><button id="exportBtn" class="tm-btn ghost" disabled>⬆ 匯出模型</button></div>
        <div id="previewEmpty" class="preview-empty">你必須先訓練模型，才能在這裡預覽。</div>
        <div id="previewBody" class="hidden">
          <div class="preview-src">
            <span>輸入</span>
            <select id="previewSource"><option value="photo">測試照片</option><option value="camera">網路攝影機</option></select>
          </div>
          <div class="preview-view">
            <video id="previewVideo" class="hidden" muted playsinline></video>
            <img id="previewPhoto" alt="">
            <div id="previewNone" class="preview-none">點下面一張測試照片</div>
          </div>
          <div id="previewStrip" class="photo-strip small"></div>
          <div class="out-title">輸出</div>
          <div id="previewBars" class="bars"></div>
        </div>
      </div>
    </div>
    <div class="credit">圖片：Rock Paper Scissors Dataset © Laurence Moroney, CC BY 2.0｜AI：TensorFlow.js MobileNet（全部在本機運算，不上傳）</div>
  </section>

  <!-- ========== STEP 2: CODE ========== -->
  <section id="page2" class="page sc hidden">
    <div class="sc-left">
      <div class="sc-tabs"><span class="on">🧩 程式</span><span>🖌️ 造型</span><span>🔊 音效</span></div>
      <div class="sc-editor">
        <div id="catColumn" class="cat-column"></div>
        <div id="blocklyDiv"></div>
        <button id="extBtn" class="ext-btn" title="擴充功能">
          <svg viewBox="0 0 40 40" width="34" height="34"><rect x="6" y="14" width="16" height="12" rx="3" fill="#fff"/><rect x="18" y="8" width="14" height="10" rx="3" fill="#fff" opacity=".8"/><path d="M28 22v10M23 27h10" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="sc-right">
      <div class="stage-bar">
        <button class="flag-btn" title="綠旗"></button>
        <button class="stop-btn" title="停止"></button>
        <span class="stage-title">舞台</span>
      </div>
      <div id="stageHost2" class="stage-host"></div>
      <div class="cam-panel">
        <div class="cam-head">
          <b>鏡頭畫面</b>
          <button class="src-btn" data-src="camera">📷 用鏡頭</button>
          <button class="src-btn" data-src="photo">🖼️ 用照片</button>
        </div>
        <div class="cam-tip">沒有鏡頭的同學：點一張照片，它就會變成「鏡頭看到的畫面」。</div>
        <div id="stripStage2" class="photo-strip"></div>
      </div>
      <div class="sprite-pane">
        <div class="sprite-card on"><img id="spriteThumb" alt=""><span>小Q</span></div>
        <div class="sprite-info">角色　小Q</div>
      </div>
    </div>
  </section>

  <!-- ========== STEP 3: RUN ========== -->
  <section id="page3" class="page run hidden">
    <div class="run-left">
      <div class="stage-bar big">
        <button class="flag-btn" title="綠旗"></button>
        <button class="stop-btn" title="停止"></button>
        <span class="stage-title">按綠旗開始，再比出手勢（或點右邊的照片）</span>
      </div>
      <div id="stageHost3" class="stage-host"></div>
    </div>
    <div class="run-right">
      <div class="card">
        <div class="cam-head">
          <b>鏡頭畫面</b>
          <button class="src-btn" data-src="camera">📷 用鏡頭</button>
          <button class="src-btn" data-src="photo">🖼️ 用照片</button>
        </div>
        <div id="stripStage3" class="photo-strip"></div>
      </div>
      <div class="card mission">
        <h3>🎯 任務：AI 看到剪刀、石頭、布，角色都要說出不一樣的話</h3>
        <button id="missionBtn" class="big-btn">開始任務檢查</button>
        <div id="missionResult"></div>
      </div>
    </div>
  </section>
</main>

<button id="teacherBtn" class="teacher-btn">老師</button>

<!-- modals -->
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="lib/tf.min.js"></script>
<script src="lib/mobilenet.min.js"></script>
<script src="lib/blockly.min.js"></script>
<script src="lib/zh-hant.js"></script>
<script src="assets/dataset.js?v=20261104b"></script>
<script src="common.js?v=20261104b"></script>
<script src="trainer.js?v=20261104b"></script>
<script src="blocks.js?v=20261104b"></script>
<script src="runtime.js?v=20261104b"></script>
<script src="mission.js?v=20261104b"></script>
</body>
</html>
